name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STRING"
          
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version from '$JAVA_VER_STRING'"
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version $MAJOR_VERSION is lower than required version 17."
            exit 1
          fi
          
          echo "Java environment verification passed (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Existing debug.keystore found at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH"
            exit 1
          fi
          
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying expected APK at $EXPECTED_APK..."
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || echo "No APKs found."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty at $EXPECTED_APK"
            exit 1
          fi
          
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::File does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "APK successfully verified: $EXPECTED_APK (Size: $APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="$RUNNER_TEMP/release_assets"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}' | tr -cs 'a-zA-Z0-9._-' '-')
          REPO_NAME=${REPO_NAME#-}
          REPO_NAME=${REPO_NAME%-}
          
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK_PATH="$TEMP_RELEASE_DIR/$RELEASE_FILENAME"
          
          cp "$ORIGINAL_APK" "$DEST_APK_PATH"
          
          if [ ! -f "$DEST_APK_PATH" ] || [ ! -s "$DEST_APK_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_APK_PATH"
          echo "asset_path=$DEST_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Check ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset not found or is empty: $ASSET_PATH"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat << 'EOF'
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK build from GitHub Actions.

          - **Build Run Number:** #${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Branch:** `${{ github.ref_name }}`
          
          > ⚠️ **Testing Notice:** This APK is signed with a temporary debug keystore and is intended for testing and validation purposes only. It is not a production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=== Release Published Successfully ==="
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME")
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Release Asset File: $ASSET_NAME"
            
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Title:** $RELEASE_TITLE
          - **Release Tag:** \`$TAG_NAME\`
          - **Release Asset:** \`$ASSET_NAME\`
          - **Release Download Link:** [View & Download APK under Assets]($RELEASE_URL)

          ### 📥 Download Options:
          1. **Direct Phone Download:** Go to the [Release Page]($RELEASE_URL) and download \`$ASSET_NAME\` directly under the **Assets** section.
          2. **GitHub Actions Artifact:** The standard build artifact \`app-debug-apk\` is also preserved in the workflow summary.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was built successfully and the GitHub Actions artifact 'app-debug-apk' remains available."
            
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built (Release Publishing Notice)

          The debug APK was successfully built and uploaded as a GitHub Actions artifact.

          - **Artifact Name:** \`app-debug-apk\` (Contains \`app-debug.apk\`)
          - **Backup Download:** Download the \`app-debug-apk\` ZIP artifact from this workflow run summary.
          EOF
          fi
