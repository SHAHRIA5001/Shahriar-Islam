name: Android CI/CD & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Identify and Rename APK
        run: |
          mkdir -p build/outputs/release
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build/outputs/release/app-release.apk
            echo "APK generated at build/outputs/release/app-release.apk"
          else
            echo "Error: APK file not found!" && exit 1
          fi

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=Release $TAG_NAME" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            DATE_STR=$(date +'%Y.%m.%d-%H%M')
            TAG_NAME="v$DATE_STR-$SHORT_SHA"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=Build $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/outputs/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
